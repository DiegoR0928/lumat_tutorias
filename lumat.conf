<VirtualHost *:80>
    ServerName lumat.amer-br.tech

    Alias /static/ /app/lumat_tutorias/staticfiles/
    <Directory /app/lumat_tutorias/staticfiles>
        Require all granted
    </Directory>

    Alias /media/ /app/lumat_tutorias/media/
    <Directory /app/lumat_tutorias/media>
        Require all granted
    </Directory>

    WSGIDaemonProcess lumat python-home=/env python-path=/app/lumat_tutorias
    WSGIProcessGroup lumat
    WSGIScriptAlias / /app/lumat_tutorias/lumat_tutorias/wsgi.py

    <Directory /app/lumat_tutorias/lumat_tutorias>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>